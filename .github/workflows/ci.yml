# Every PR and push: lint, type-check, tests, build.
# Push to main (and manual runs): also build the amd64 image and push it to
# ghcr.io/<owner>/g-seekr as :main and :sha-<short sha>. Deployment is manual:
# homelab-iac pins the image by digest.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PINNED: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Pinned image: $PINNED"
          {
            echo "## Image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Pin it by digest:"
            echo '```'
            echo "$PINNED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
